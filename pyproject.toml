[project]
name = "pqc-mcda-prototipo"
version = "0.1.0"
description = "Protótipo: priorização multicritério da migração para criptografia pós-quântica (SAPEVO-M + ELECTRE III com veto de Mosca x soma ponderada)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "streamlit>=1.38", "fpdf2>=2.7", "openpyxl>=3.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
